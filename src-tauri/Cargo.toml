[package]
name = "sc-rust-client"
version = "0.1.0"
description = "SoundCloud desktop client for Linux"
edition = "2021"
default-run = "sc-rust-client"

[lib]
name = "sc_rust_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4"] }
souvlaki = "0.8"
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "6"
regex = "1"
url = "2"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
